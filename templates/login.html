{% extends 'base.html' %}

{% block title %}Login | InstituteHub{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome back</h2>
    <p>Sign in to access your institute dashboard.</p>
    {% if form.errors %}
        <div class="alert alert-error">Your username and password did not match. Please try again.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Login</button>
        </div>
    </form>
</div>
{% endblock %}
