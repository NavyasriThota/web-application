{% extends 'base.html' %}

{% block title %}{{ title }} | InstituteHub{% endblock %}

{% block content %}
<div class="panel">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            {{ form.as_p }}
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'hr_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
